<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine views on the name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the five positions the contributors take on the name sit as a row of labels. All nine faces sit beneath, each wired to their position. Selecting a face or a position shows the quote behind it. Tokens mirror explori.com/conex. */
:root{
  --bg:#0A0F1E; --panel:#10172B; --line:rgba(148,163,210,.16); --fg:#E9EEFA; --muted:#8E9AC0;
  --teal:#33E1D5; --violet:#725AFF;
  --display:'Poppins',ui-sans-serif,system-ui,sans-serif; --body:'Inter',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-block:8px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
h2{font:700 clamp(22px,3.2vw,32px)/1.15 var(--display);margin:10px 0 6px;text-wrap:balance;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch;line-height:1.5}
.board{position:relative;border:1px solid var(--line);border-radius:18px;background:radial-gradient(120% 90% at 50% 0%,rgba(114,90,255,.14),transparent 60%),var(--panel);padding:22px 18px 20px}
.pos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;position:relative;z-index:1}
.chip{appearance:none;border:1px solid var(--line);background:rgba(10,15,30,.6);color:var(--fg);border-radius:14px;padding:12px 10px;font:600 14px/1.25 var(--display);cursor:pointer;text-align:center;transition:border-color .3s,background .3s,opacity .3s;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.chip small{font:500 11px/1 var(--body);color:var(--muted);letter-spacing:.04em}
.chip[aria-pressed="true"]{border-color:var(--c);background:rgba(255,255,255,.06)}
.chip.dim{opacity:.4}
.chip:focus-visible,.face:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wire{fill:none;stroke-width:1.5;opacity:.28;transition:opacity .35s,stroke-width .35s}
.wire.on{opacity:.95;stroke-width:2.4}
.faces{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;margin-top:70px;position:relative;z-index:1}
.face{appearance:none;background:none;border:0;padding:0;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .3s,transform .4s cubic-bezier(.2,.7,.2,1)}
.face span.ph{width:100%;max-width:64px;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--c);background:#1c2654;display:block}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face b{font:600 11px/1.2 var(--body);text-align:center}
.face.dim{opacity:.3}
.face.sel{transform:translateY(-4px)}
.face.sel span.ph{box-shadow:0 0 0 3px rgba(255,255,255,.18),0 0 22px var(--c)}
.quote{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;min-height:150px}
.quote .stance{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--teal))}
.quote p{margin:10px 0 0;font:500 clamp(16px,2vw,19px)/1.5 var(--display);max-width:70ch}
.quote cite{display:block;margin-top:8px;color:var(--muted);font:400 13px/1.4 var(--body);font-style:normal}
.explori{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.explori button{appearance:none;border:1px solid var(--teal);background:transparent;color:var(--fg);border-radius:999px;padding:9px 16px;font:600 13px/1 var(--body);cursor:pointer}
.explori button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:760px){
  .pos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pos .chip:last-child{grid-column:1/-1}
  .faces{grid-template-columns:repeat(5,minmax(0,1fr));margin-top:22px;row-gap:14px}
  svg.wires{display:none}
}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.face,.chip,.wire{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">What’s in a name?</div>
  <h2>Nine contributors on the name</h2>
  <p class="lede">Only one of them proposes a name. The rest care more about who is in the room, or what is being sold. Tap a position or a face.</p>
  <div class="board" id="board">
    <svg class="wires" id="wires" aria-hidden="true"></svg>
    <div class="pos" id="pos" role="group" aria-label="Positions on the name"></div>
    <div class="faces" id="faces" role="group" aria-label="Contributors"></div>
    <div class="quote" id="quote" aria-live="polite"><div class="stance"></div><p></p><cite></cite></div>
    <div class="explori"><button id="ex" type="button">So what does Explori call it?</button><span id="exA" hidden>A ConEx: a connection experience. Named so it can be benchmarked against its own kind.</span></div>
  </div>
</div>

const P=[
 {k:'jon',s:'mkt',n:'Jon Weiner',r:'Founder and CEO, HLTH',q:'People who’ve worked with me have heard me talk about marketplaces a lot. The question is: how do you create the best marketplace, where every side gets value?'},
 {k:'jessica',s:'exp',n:'Jessica Blue',r:'Executive Vice President, Money20/20 USA',q:'It is experience-led. We talk about it constantly, daily – the experience of the attendee, the sponsor, the partner and we ask ourselves ‘how can we make this better?’'},
 {k:'jay',s:'nof',n:'Jay Weintraub',r:'Founder and CEO, Connectiv',q:'I do not like the term festival. It does not engender ‘I’m going to be productive, I’m going to learn’.'},
 {k:'mark',s:'nof',n:'Mark Shashoua',r:'CEO, Hyve Group',q:'…yes, there is entertainment, dinners, parties and an enormous amount of experience that the event is wrapped up in. But that’s not a festival in any shape or form.'},
 {k:'nicola',s:'lab',n:'Nicola Kastner',r:'CEO, Event Leaders Exchange',q:'Whether you say you call yourself a ‘trade show’, a ‘conference’ or a ‘ConEx’ or whatever the terminology is means nothing to us.'},
 {k:'colleen',s:'lab',n:'Colleen Bisconti',r:'Former Vice President, Global Conferences & Events, IBM',q:'Don’t come and give me your package and say, ‘Pick A, B, or C. Have a nice day.’ I want the show producer to ask: ‘What are you trying to accomplish?’'},
 {k:'anna',s:'lab',n:'Anna John',r:'Partner, Mayfield Media Strategies',q:'Potential buyers and investors are increasingly format agnostic.'},
 {k:'phil',s:'dep',n:'Phil Soar',r:'Chairman, CloserStill and Nineteen Group',q:'Any show that is obviously transactional… buyers and sellers want to spend time on stands… They don’t want to be taken off the show floor.'},

function show(p){const s=SM[p.s];q.style.setProperty('--c',s.c);qs.textContent=s.t.replace(/[“”]/g,'');qp.textContent='“'+p.q+'”';qc.textContent=p.n+', '+p.r;[qs,qp,qc].forEach(e=>{e.classList.remove('fade');void e.offsetWidth;e.classList.add('fade');});}
function pickStance(k){S.forEach(s=>{s.el.setAttribute('aria-pressed',s.k===k);s.el.classList.toggle('dim',s.k!==k);});
  const g=P.filter(p=>p.s===k);P.forEach(p=>{p.el.classList.toggle('dim',p.s!==k);p.el.classList.remove('sel');p.w&&p.w.classList.toggle('on',p.s===k);});show(g[0]);g[0].el.classList.add('sel');}
function pickPerson(p){S.forEach(s=>{s.el.setAttribute('aria-pressed',s.k===p.s);s.el.classList.toggle('dim',s.k!==p.s);});
  P.forEach(o=>{o.el.classList.toggle('dim',o.s!==p.s);o.el.classList.toggle('sel',o===p);o.w&&o.w.classList.toggle('on',o===p);});show(p);}
// Explori reveal
const ex=document.getElementById('ex'),exA=document.getElementById('exA');ex.onclick=()=>{exA.hidden=false;exA.classList.add('fade');ex.setAttribute('aria-expanded','true');};
// tour
let i=0,timer=null;const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
function stop(){clearTimeout(timer);timer=null;}
function tour(){pickPerson(P[i]);i=(i+1)%P.length;timer=setTimeout(tour,4200);}
drawWires();pickPerson(P[0]);
new ResizeObserver(()=>{drawWires();const sel=P.find(p=>p.el.classList.contains('sel'));if(sel)sel.w&&sel.w.classList.add('on');post();}).observe(board);
if(!rm)new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){o.disconnect();i=1;timer=setTimeout(tour,2600);}}),{threshold:.4}).observe(board);
function post(){try{parent.postMessage({source:'conex-visual',id:'name-views',height:document.documentElement.scrollHeight},'*')}catch(e){}}
post();
})();
</script>
