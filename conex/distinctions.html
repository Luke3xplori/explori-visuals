<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade show or ConEx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a side-on scene of the room that switches between a trade show hall and a ConEx, the same people moving between the two. Below it, the paper's five distinctions for whichever format is selected, then the four things both share. Tokens mirror explori.com/conex. */
:root{
  --bg:#0A0F1E; --panel:#10172B; --panel2:#141C35; --line:rgba(148,163,210,.16); --fg:#E9EEFA; --muted:#8E9AC0;
  --teal:#33E1D5; --violet:#725AFF; --sky:#6FB6FF; --grey:#5B6787;
  --display:'Poppins',ui-sans-serif,system-ui,sans-serif; --body:'Inter',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-block:8px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
h2{font:700 clamp(22px,3.2vw,32px)/1.15 var(--display);margin:10px 0 0;text-wrap:balance;letter-spacing:-.01em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px;background:var(--panel)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 14px/1 var(--body);padding:10px 18px;border-radius:999px;cursor:pointer;transition:background .3s,color .3s}
.seg button[aria-pressed="true"]{color:#fff;background:linear-gradient(90deg,var(--violet),var(--teal))}
.seg button[data-f="ts"][aria-pressed="true"]{background:#2B3556}
.seg button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.scene{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);position:relative}
.scene svg{display:block;width:100%;height:auto}
.cap{position:absolute;left:12px;top:12px;background:rgba(10,15,30,.7);padding:6px 9px;border-radius:999px;font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.layer{transition:opacity .9s ease}
.fig{transition:transform 1.4s cubic-bezier(.45,.05,.2,1),opacity .8s ease;transform-box:view-box}
.fig circle,.fig rect{transition:fill 1.2s ease}
.beam{animation:sway 6s ease-in-out infinite alternate;transform-origin:var(--o);transform-box:view-box}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.dims{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.dim{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px 14px 16px;min-width:0;display:flex;flex-direction:column}
.dim h3{margin:0 0 10px;font:600 14px/1.25 var(--display);color:var(--fc,var(--teal));transition:color .5s}
.dim ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.dim li{font-size:13px;line-height:1.45;color:var(--fg)}
.dim li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fc,var(--teal));margin:0 8px 1px 0;vertical-align:middle;transition:background .5s}
.swap{animation:swap .5s ease both}@keyframes swap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.common{margin-top:26px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px 18px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:center}
.venn{position:relative;height:120px}
.venn span{position:absolute;top:10px;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font:600 11px/1.2 var(--body);text-align:center;letter-spacing:.04em;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.venn .a{left:20px;border:2px solid var(--grey);background:rgba(91,103,135,.16);color:var(--muted);transform:translateX(-26px)}
.venn .b{left:100px;border:2px solid var(--teal);background:rgba(51,225,213,.10);color:var(--teal);transform:translateX(26px)}
.venn.on .a,.venn.on .b{transform:none}
.venn .a b,.venn .b b{position:relative;top:0}
.venn .a b{left:-18px}.venn .b b{left:18px}
.venn i{position:absolute;left:100px;top:28px;width:20px;height:64px;border-radius:50%;background:linear-gradient(180deg,var(--violet),var(--teal));opacity:0;filter:blur(6px);transition:opacity .6s .9s}
.venn.on i{opacity:.9}
.common h3{margin:0 0 12px;font:600 18px/1.25 var(--display)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.common.on .tile{opacity:1;transform:none}
.tile .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--display);color:#0A0F1E;background:linear-gradient(135deg,var(--violet),var(--teal))}
.tile p{margin:0;font-size:13px;line-height:1.45}
@media (max-width:860px){.dims{grid-template-columns:1fr 1fr}.dims .dim:last-child{grid-column:1/-1}.common{grid-template-columns:1fr}.venn{width:220px;margin:0 auto}.tiles{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.scene svg{height:200px}.cap{font-size:10px}.dims{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.layer,.fig,.fig circle,.fig rect,.tile,.venn span,.venn i{transition:none}.beam{animation:none}.swap{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">Distinctions</div><h2>Same people, a different room</h2></div>
    <div class="seg" role="group" aria-label="Choose a format"><button data-f="ts" aria-pressed="true">Trade show</button><button data-f="cx" aria-pressed="false">ConEx</button></div>
  </div>
  <div class="scene" id="scene">
    <svg viewBox="0 0 960 250" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="sceneT"><title id="sceneT">A side view of the event floor</title>
      <defs>
        <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#725AFF"/><stop offset="1" stop-color="#33E1D5"/></linearGradient>
        <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9A8FF" stop-opacity=".55"/><stop offset="1" stop-color="#B9A8FF" stop-opacity="0"/></linearGradient>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1F4B"/><stop offset="1" stop-color="#10172B"/></linearGradient>
      </defs>
      <!-- trade show hall -->
      <g class="layer" id="ts">
        <rect x="0" y="0" width="960" height="250" fill="#111827"/>
        <g stroke="#2A3452" stroke-width="2" fill="none"><path d="M0 34 H960"/><path d="M0 14 H960"/>
          <path d="M0 34 L20 14 L40 34 L60 14 L80 34 L100 14 L120 34 L140 14 L160 34 L180 14 L200 34 L220 14 L240 34 L260 14 L280 34 L300 14 L320 34 L340 14 L360 34 L380 14 L400 34 L420 14 L440 34 L460 14 L480 34 L500 14 L520 34 L540 14 L560 34 L580 14 L600 34 L620 14 L640 34 L660 14 L680 34 L700 14 L720 34 L740 14 L760 34 L780 14 L800 34 L820 14 L840 34 L860 14 L880 34 L900 14 L920 34 L940 14 L960 34"/></g>
        <g fill="#FFF6D8" opacity=".25"><rect x="60" y="36" width="70" height="4"/><rect x="250" y="36" width="70" height="4"/><rect x="440" y="36" width="70" height="4"/><rect x="630" y="36" width="70" height="4"/><rect x="820" y="36" width="70" height="4"/></g>
        <g id="booths"></g>
        <rect x="0" y="214" width="960" height="36" fill="#0D1322"/>
        <g fill="#2A3452"><rect x="0" y="214" width="960" height="2"/></g>
      </g>
      <!-- conex room -->
      <g class="layer" id="cx" opacity="0">
        <rect x="0" y="0" width="960" height="250" fill="url(#sky)"/>
        <path class="beam" style="--o:300px 0px" d="M300 0 L250 214 L350 214 Z" fill="url(#beam)"/>
        <path class="beam" style="--o:480px 0px;animation-delay:-2s" d="M480 0 L425 214 L535 214 Z" fill="url(#beam)"/>
        <path class="beam" style="--o:660px 0px;animation-delay:-4s" d="M660 0 L610 214 L710 214 Z" fill="url(#beam)"/>
        <!-- stage -->
        <rect x="360" y="70" width="240" height="96" rx="6" fill="url(#g1)" opacity=".85"/>
        <rect x="372" y="82" width="216" height="72" rx="3" fill="#0A0F1E" opacity=".35"/>
        <text x="480" y="125" text-anchor="middle" fill="#fff" font-family="Poppins,sans-serif" font-weight="700" font-size="20" opacity=".9">KEYNOTE</text>
        <rect x="330" y="176" width="300" height="16" rx="3" fill="#2B2F66"/>
        <!-- lounge -->
        <g fill="#3B2E7A"><rect x="40" y="176" width="110" height="20" rx="8"/><rect x="40" y="160" width="18" height="36" rx="6"/><rect x="132" y="160" width="18" height="36" rx="6"/></g>
        <text x="95" y="150" text-anchor="middle" fill="#B9A8FF" font-family="Inter,sans-serif" font-weight="600" font-size="11" letter-spacing="1.5">LOUNGE</text>
        <!-- dinner -->
        <g fill="#204F63"><rect x="720" y="182" width="120" height="8" rx="3"/><rect x="730" y="190" width="6" height="24"/><rect x="824" y="190" width="6" height="24"/></g>
        <g fill="#FFD27A" opacity=".8"><circle cx="745" cy="178" r="3"/><circle cx="780" cy="178" r="3"/><circle cx="815" cy="178" r="3"/></g>
        <text x="780" y="160" text-anchor="middle" fill="#33E1D5" font-family="Inter,sans-serif" font-weight="600" font-size="11" letter-spacing="1.5">HOSTED DINNER</text>
        <!-- beach -->
        <text x="912" y="26" text-anchor="middle" fill="#FFB86B" font-family="Inter,sans-serif" font-weight="600" font-size="11" letter-spacing="1.5">OFF-SITE</text>
        <circle cx="915" cy="56" r="18" fill="#FFB86B" opacity=".85"/>
        <path d="M900 214 C902 170 906 140 912 110" stroke="#6B4E3A" stroke-width="5" fill="none"/>
        <g fill="#2FBF8F"><path d="M912 110 C890 100 872 108 864 120 C882 112 898 112 912 112Z"/><path d="M912 110 C934 98 952 104 958 118 C942 110 926 110 912 112Z"/><path d="M912 110 C906 92 914 80 926 76 C918 90 916 100 913 111Z"/></g>
        <!-- activation pod -->
        <path d="M200 214 a46 46 0 0 1 92 0Z" fill="#2B2F66"/><path d="M212 214 a34 34 0 0 1 68 0Z" fill="none" stroke="#33E1D5" stroke-width="2" opacity=".7"/>
        <text x="246" y="160" text-anchor="middle" fill="#33E1D5" font-family="Inter,sans-serif" font-weight="600" font-size="11" letter-spacing="1.5">ACTIVATION</text>
        <rect x="0" y="214" width="960" height="36" fill="#121a38"/>
      </g>
      <g id="people"></g>
    </svg>
    <div class="cap" id="cap">Exhibition hall</div>
  </div>
  <div class="dims" id="dims"></div>
  <div class="common" id="common">
    <div class="venn" id="venn" aria-hidden="true"><span class="a"><b>Trade show</b></span><span class="b"><b>ConEx</b></span><i></i></div>
    <div><h3>What both have in common</h3><div class="tiles" id="tiles"></div></div>
  </div>
</div>
<script>
(()=>{
const D=[
 {h:'Attendees',ts:['Broadly more inclusive and aims at attracting the largest relevant audience, often with a wider range of seniorities and interests','The small minority of trade shows include a hosted buyer programme','Total attendee numbers is typically the key factor or metric'],
  cx:['Targeted more exclusively at buyers and professionals of a particular level of seniority, influence or specialism','Almost all ConExs include a hosted buyer programme','Audience composition is typically more important than total numbers as a metric']},
 {h:'Funding model',ts:['The predominant revenue line is the sale of exhibit space','Usually there is no charge or a nominal entry fee for attendees'],
  cx:['While most sponsors have an exhibit presence, the predominant revenue line is the sale of sponsorship packages and bespoke activations','Usually there is a premium entry fee paid by those attendees who are not hosted']},
 {h:'Participant experience',ts:['Typically, attendee journeys are comparatively lightly curated','Most exhibitors and sponsors predominantly engage with attendees from their booth space'],
  cx:['Typically, attendee experiences are more highly curated','Sponsors engage attendees both from their booths and off-booth activations, but also more broadly in the wider event experience']},
 {h:'The sales approach',ts:['For the majority of booth sales, the sales process is relatively simple: 1) decide to exhibit, 2) choose a booth from the floorplan'],
  cx:['The sales process is considerably more consultative as each package is customised around the broader sponsorship, thought leadership and engagement opportunities the brand requires']},
 {h:'Venue selection',ts:['Optimising the commercialisation of exhibit space typically requires an exhibition or convention facility'],
  cx:['A broader range of venue options can be used including convention facilities, hotels, outdoor spaces, sports stadiums, even beaches']}
];
const C=['Both aim to deliver engagement, connections, relationships, fun, entertainment, value for attendees, and ROI for brands','Both deliver brand engagement opportunities','Both deliver content programmes','Both can describe their event as a festival, a conference, a convention, a show'];
const NS='http://www.w3.org/2000/svg',el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
// booths: back row and front row along the hall
const booths=document.getElementById('booths');
for(let i=0;i<9;i++){const x=10+i*106;booths.appendChild(el('rect',{x:x,y:96,width:92,height:62,fill:'#1B2440'}));booths.appendChild(el('rect',{x:x,y:88,width:92,height:12,fill:i%3===0?'#33405F':'#2A3452'}));
  booths.appendChild(el('rect',{x:x+20,y:140,width:52,height:18,fill:'#24304E'}));}
for(let i=0;i<6;i++){const x=40+i*156;booths.appendChild(el('rect',{x:x,y:150,width:120,height:64,fill:'#222C4A'}));booths.appendChild(el('rect',{x:x,y:140,width:120,height:14,fill:'#3A4768'}));
  booths.appendChild(el('rect',{x:x+30,y:190,width:60,height:24,fill:'#2C3757'}));}
// people: positions in each room
const N=34,people=document.getElementById('people'),figs=[];
const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(7);
const tsPos=[];for(let i=0;i<N;i++){tsPos.push([12+i*(936/N)+rnd()*14, 0]);}
const clusters=[{x:95,n:5,c:'#B9A8FF'},{x:246,n:6,c:'#33E1D5'},{x:480,n:10,c:'#E9EEFA'},{x:780,n:7,c:'#33E1D5'},{x:905,n:3,c:'#FFB86B'}];
const cxPos=[];clusters.forEach(cl=>{for(let j=0;j<cl.n;j++){cxPos.push([cl.x+(j-(cl.n-1)/2)*15+ (rnd()-.5)*4,0,cl.c]);}});
while(cxPos.length<N)cxPos.push([480,0,'#E9EEFA',true]);
for(let i=0;i<N;i++){const g=el('g',{class:'fig'});const h=10+Math.round(rnd()*3);
  g.appendChild(el('circle',{cx:0,cy:-h-14,r:4.2,fill:'#6E7AA0'}));g.appendChild(el('rect',{x:-4.5,y:-h-9,width:9,height:h+9,rx:3.5,fill:'#6E7AA0'}));
  people.appendChild(g);figs.push(g);}
const dims=document.getElementById('dims');
D.forEach(d=>{const c=document.createElement('div');c.className='dim';c.innerHTML=`<h3>${d.h}</h3><ul></ul>`;dims.appendChild(c);d.ul=c.querySelector('ul');});
const tiles=document.getElementById('tiles');C.forEach((t,i)=>{const e=document.createElement('div');e.className='tile';e.style.transitionDelay=(1.0+i*.12)+'s';e.innerHTML=`<span class="n">${i+1}</span><p>${t}</p>`;tiles.appendChild(e);});
const ts=document.getElementById('ts'),cx=document.getElementById('cx'),cap=document.getElementById('cap'),btns=[...document.querySelectorAll('.seg button')];
let mode=null;
function set(m){if(m===mode)return;mode=m;btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===m));
  ts.style.opacity=m==='ts'?1:0;cx.style.opacity=m==='cx'?1:0;cap.textContent=m==='ts'?'Exhibition hall':'Hotel, stadium, beach or hall';
  figs.forEach((g,i)=>{const p=m==='ts'?tsPos[i]:cxPos[i];g.style.transform=`translate(${p[0]}px,214px)`;g.style.opacity=(m==='cx'&&p[3])?0:1;
    const col=m==='ts'?'#6E7AA0':p[2];g.querySelectorAll('circle,rect').forEach(s=>s.setAttribute('fill',col));g.style.transitionDelay=(i%9)*0.04+'s';});
  const fc=m==='ts'?'#9AA6C8':'#33E1D5';
  D.forEach(d=>{d.ul.parentElement.style.setProperty('--fc',fc);d.ul.innerHTML=d[m].map(t=>`<li>${t}</li>`).join('');d.ul.classList.remove('swap');void d.ul.offsetWidth;d.ul.classList.add('swap');});
  post();}
btns.forEach(b=>b.onclick=()=>{stopAuto();set(b.dataset.f);});
set('ts');
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;let t=null,n=0;
function stopAuto(){clearTimeout(t);t=null;}
function auto(){set(mode==='ts'?'cx':'ts');n++;if(n<3)t=setTimeout(auto,4200);}
const scene=document.getElementById('scene');
if(!rm)new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){o.disconnect();t=setTimeout(auto,1400);}}),{threshold:.5}).observe(scene);
const common=document.getElementById('common'),venn=document.getElementById('venn');
const showCommon=()=>{common.classList.add('on');venn.classList.add('on');};
if(rm)showCommon();else new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){o.disconnect();showCommon();}}),{threshold:.4}).observe(common);
function post(){try{parent.postMessage({source:'conex-visual',id:'distinctions',height:document.documentElement.scrollHeight},'*')}catch(e){}}
new ResizeObserver(post).observe(document.body);post();
})();
</script>
</body>
</html>
